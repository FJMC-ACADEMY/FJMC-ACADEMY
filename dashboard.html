<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="stylesheet" href="student.css">

<style>

body {
    display: block;
    background: #f5f7fa;
}

.dashboard {

    max-width: 1100px;

    margin: auto;

    padding: 30px 20px;

}

.topbar {

    background: #182033;

    color: white;

    padding: 20px;

    border-radius: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;

}

.logout {

    background: #e63946;

    color: white;

    border: none;

    padding: 10px 18px;

    border-radius: 5px;

    cursor: pointer;

}

.courses {

    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap: 20px;

}

.course {

    background: white;

    padding: 25px;

    border-radius: 10px;

    box-shadow: 0 5px 20px
        rgba(0,0,0,.08);

}

.course h3 {

    margin-bottom: 10px;

}

.course button {

    margin-top: 15px;

    background: #e63946;

    color: white;

    border: none;

    padding: 10px 18px;

    border-radius: 5px;

    cursor: pointer;

}

</style>

</head>

<body>

<div class="dashboard">

    <div class="topbar">

        <div>

            <h2>FJMC Academy</h2>

            <p id="studentName">
                Student
            </p>

        </div>

        <button
            class="logout"
            id="logoutBtn">

            Logout

        </button>

    </div>


    <h2>Your Courses</h2>

    <br>

    <div
        class="courses"
        id="coursesContainer">

    </div>

</div>


<script
    type="module"
    src="dashboard.js">
</script>

</body>

</html>
