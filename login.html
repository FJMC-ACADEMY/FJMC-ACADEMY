<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FJMC Academy - Student Login</title>

<link rel="stylesheet" href="student.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>FJMC Academy</h1>

        <p class="subtitle">Student Login</p>

        <form id="loginForm">

            <label>Email / Student ID</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</div>

<script type="module" src="login.js"></script>
<form id="loginForm">

<input
    type="email"
    id="email"
    required
>

<input
    type="password"
    id="password"
    required
>

<button type="submit">
    Login
</button>

<div id="loginMessage"></div>

</form>

</body>

</html>
