<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f3f4f6; display:flex; justify-content:center; align-items:center; height:100vh; padding-bottom:0;">
    <div style="background:white; padding:40px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1); max-width:400px; width:100%;">
        <h2 style="text-align:center; color:#e11d48; margin-bottom:20px;">Student Login</h2>
        <form id="studentLoginForm">
            <div style="margin-bottom:15px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Email Address</label>
                <input type="email" id="studentEmail" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Password</label>
                <input type="password" id="studentPassword" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <button type="submit" style="background:#e11d48; color:white; border:none; width:100%; padding:12px; font-weight:bold; cursor:pointer; border-radius:4px;">Access Portal</button>
        </form>
        <p id="loginMessage" style="text-align:center; margin-top:15px; font-weight:bold;"></p>
    </div>

    <script type="module">
        import { auth } from './firebase.js';
        import { signInWithEmailAndPassword } from "https://gstatic.com";

        document.getElementById("studentLoginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("studentEmail").value;
            const pass = document.getElementById("studentPassword").value;
            const msg = document.getElementById("loginMessage");

            msg.innerText = "Authenticating...";
            msg.style.color = "blue";

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    msg.innerText = "Success! Redirecting...";
                    msg.style.color = "green";
                    window.location.href = "dashboard.html";
                })
                .catch(err => {
                    msg.innerText = "Error: " + err.message;
                    msg.style.color = "red";
                });
        });
    </script>
</body>
</html>
